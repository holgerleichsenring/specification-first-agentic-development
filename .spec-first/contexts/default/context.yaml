    2026-10-28-4dec: "Release 2.8.1: agents read each context.yaml down to state: and search state.done instead of reading it; template, AGENTS.md, skills, README; update-project 3k -> .spec-first/specs/done/2026-10-28-4dec-read-order-index-search.yaml"
    2026-10-27-84f4d: "Release 2.8.0: every version field, update-project 3j offering AGENTS.md and gate: git with the installer, migration table and paths end in 3j -> .spec-first/specs/done/2026-10-27-84f4d-release-2-8-0.yaml"
