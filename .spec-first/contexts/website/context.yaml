# yaml-language-server: $schema=../../../templates/context.schema.json
meta:
  project: spec-first-website
  type: [website]
  purpose: "spec-first.dev: the method on one page, built with Eleventy and deployed by Vercel."
  workdir: "website"

methodology:
  version: "2.8.1"

stack:
  runtime: Node 20+
  lang: [Nunjucks, CSS, JavaScript]
  infra: [Vercel]
  sdks: ["@11ty/eleventy 3.1.5"]

arch:
  style: [static site]
  layers:
    - src/_data      # site.json: names, URLs, author
    - src/_includes  # base layout: meta, Open Graph, JSON-LD, nav, footer
    - src            # index, 404, llms.txt, sitemap, robots
    - src/static     # tokens.css, styles.css, main.js, favicon, og image (passed through)

verify:
  - label: website
    command: "cd website && npm ci && npm run build"
    when_present: website/package.json

state:
  done:
    2026-10-28-cdc5: "Comparison table takes the full page width, so the GSD column is no longer cut off at desktop widths -> .spec-first/specs/done/2026-10-28-cdc5-compare-table-width.yaml"
    2026-10-28-77b7: "Comparison adds GSD as a fourth column from its README and COMMANDS.md read 2026-10-28; card, FAQ, field report, llms.txt and README name it -> .spec-first/specs/done/2026-10-28-77b7-compare-gsd.yaml"
    2026-10-28-c3b9: "Field report (/field-report/) with figures counted 2026-10-28, comparison with Spec Kit and BMAD (/compare/), five FAQ entries from the HN and Reddit threads, nav and reading links -> .spec-first/specs/done/2026-10-28-c3b9-website-field-report.yaml"
    2026-10-27-258f: "GA4 behind a consent banner: gtag.js only on Accept, signals off; banner and /privacy/ only with site.legal name and email, /imprint/ only with an address too; check-consent in postbuild proves each state -> .spec-first/specs/done/2026-10-27-258f-website-analytics-consent.yaml"
    2026-10-27-aac1: "spec-first.dev: 139-character meta description, both search terms in title, kicker, a FAQ with FAQPage JSON-LD from _data/faq.json, alternateName list, llms.txt, README and manifests -> .spec-first/specs/done/2026-10-27-aac1-website-search-terms.yaml"
    2026-10-27-aebe: "Hero is an animated VS Code + Claude Code scene building a todo app through the four commands, with step bubbles; series board in its own section; record without contexts -> .spec-first/specs/done/2026-10-27-aebe-website-guided-hero.yaml"
    2026-10-27-8d39b: "spec-first.dev: one Eleventy page under website/ from the approved mock, llms.txt, og image, website verify stage -> .spec-first/specs/done/2026-10-27-8d39b-website-spec-first-dev.yaml"
