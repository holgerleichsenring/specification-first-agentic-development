# yaml-language-server: $schema=../../../templates/context.schema.json
meta:
  project: spec-first-website
  type: [website]
  purpose: "spec-first.dev: the method on one page, built with Eleventy and deployed by Vercel."
  workdir: "website"

methodology:
  version: "2.8.0"

stack:
  runtime: Node 20+
  lang: [Nunjucks, CSS, JavaScript]
  infra: [Vercel]
  sdks: ["@11ty/eleventy 3.1.5"]

arch:
  style: [static site]
  layers:
    - src/_data      # site.json: names, URLs, author
    - src/_includes  # base layout: meta, Open Graph, JSON-LD, nav, footer
    - src            # index, 404, llms.txt, sitemap, robots
    - src/static     # tokens.css, styles.css, main.js, favicon, og image (passed through)

verify:
  - label: website
    command: "cd website && npm ci && npm run build"
    when_present: website/package.json

state:
  done:
    2026-10-27-aebe: "Hero is an animated VS Code + Claude Code scene building a todo app through the four commands, with step bubbles; series board in its own section; record without contexts -> .spec-first/specs/done/2026-10-27-aebe-website-guided-hero.yaml"
    2026-10-27-8d39b: "spec-first.dev: one Eleventy page under website/ from the approved mock, llms.txt, og image, website verify stage -> .spec-first/specs/done/2026-10-27-8d39b-website-spec-first-dev.yaml"
  active: {}
  planned: {}
