# yaml-language-server: $schema=../templates/decision.schema.json
phase: p-sfad-plugin
category: TradeOff
chose: "Manual install via git clone + --plugin-dir for MVP"
over: "Wait for the Anthropic marketplace listing before shipping"
reason: |
  Marketplace listing is a separate effort with its own approval
  cycle. Git clone + the local --plugin-dir flag works today, has
  zero dependencies, and lets early adopters use the plugin without
  blocking on Anthropic's review queue. Once the marketplace listing
  lands, the README adds the one-line install command.
