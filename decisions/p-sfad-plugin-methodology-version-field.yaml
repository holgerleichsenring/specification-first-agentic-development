# yaml-language-server: $schema=../templates/decision.schema.json
phase: p-sfad-plugin
category: Implementation
chose: "methodology.version field in context.yaml is the single source of truth"
over: "Hardcoded version checks against an external file"
reason: |
  The user's own context.yaml records which methodology version they
  bootstrapped with. The plugin's plugin.json carries the current
  version. The comparison is local: if context.yaml's version is
  older, update-project shows the diff. No central registry, no
  network call.
