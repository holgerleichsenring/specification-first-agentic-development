# yaml-language-server: $schema=../templates/decision.schema.json
phase: p-sfad-plugin
category: TradeOff
chose: "No automated tests for the plugin"
over: "A test harness that drives Claude Code with fixture prompts"
reason: |
  Plugin quality is trigger-description quality and skill-prose
  quality, both verified by manual testing with real prompts. SKILL.md
  files are prose, not code — there's no behaviour to assert in a
  unit-test sense. Building a Claude-driven test harness for prose
  would cost more than the bugs it would catch at this scale.
