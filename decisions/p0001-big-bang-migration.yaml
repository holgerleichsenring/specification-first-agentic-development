# yaml-language-server: $schema=../templates/decision.schema.json
phase: p0001
category: Implementation
chose: "Big-bang v1 → v2 migration in update-project"
over: "Staged dual-write or backwards-compat shim that accepts both layouts"
reason: |
  Structural change only — files move, formats convert, no semantic
  content rewrites. A staged migration would force every spec-first
  consumer (Agent Smith and any other adopter) to handle both layouts
  simultaneously, doubling code paths for no operator benefit. Git is
  the safety net; if the migration goes wrong, `git diff` shows
  exactly what changed and the operator reverts.
