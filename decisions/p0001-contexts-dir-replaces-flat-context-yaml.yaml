# yaml-language-server: $schema=../templates/decision.schema.json
phase: p0001
category: Architecture
chose: "contexts/<name>/ directory replaces flat .{project}/context.yaml"
over: "Keeping flat root context.yaml for single-stack, only nesting for monorepo"
reason: |
  Single discovery mechanism for single-stack and monorepo projects.
  Consumers glob `contexts/*/context.yaml` and get one stack per hit.
  The single-stack default is `contexts/default/`. Monorepos add
  siblings (`contexts/server/`, `contexts/client/`, ...). The
  alternative — special-case root file for single-stack, nested
  layout for monorepo — forces every consuming agent to know two
  layouts and pick the right code path.
alternatives:
  - "Scatter .{project}/ across sub-packages — rejected: hard to find, scattered commits, mixed history"
  - "Single context.yaml with stacks: list inside — rejected: monolithic file, merge-conflict prone"
