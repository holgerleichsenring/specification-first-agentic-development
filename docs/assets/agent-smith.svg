<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 340" role="img" aria-labelledby="t d">
  <title id="t">Built this way: Agent Smith</title>
  <desc id="d">Agent Smith, an open source agentic software factory, is built spec-first: more than 1,300 specs done, more than 1,190 decision files, 94% of all changed lines came in through a spec, more than 800 commits through the gate. Counted in the Agent Smith repository in October 2026.</desc>

  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22345a"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sec { font-size: 14px; font-weight: 700; letter-spacing: 2.5px; fill: #7fd18f; }
    .num { font-size: 50px; font-weight: 800; fill: #ffffff; }
    .unit { font-size: 16px; fill: #b7c3da; }
  </style>

  <rect width="1360" height="340" rx="24" fill="url(#navy)"/>

  <text x="64" y="76" class="sec">BUILT THIS WAY</text>
  <text x="64" y="128" font-size="40" font-weight="700" fill="#fff">Agent Smith</text>
  <text x="64" y="166" font-size="17" fill="#c9d3e6">The open source agentic software factory.</text>
  <text x="64" y="192" font-size="17" fill="#c9d3e6">Built spec by spec, and every spec</text>
  <text x="64" y="218" font-size="17" fill="#c9d3e6">left its reasons on record.</text>
  <text x="64" y="290" font-size="14" fill="#8fa0bf">Counted in the Agent Smith repository, October 2026.</text>

  <g>
    <rect x="560" y="64" width="356" height="112" rx="16" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="940" y="64" width="356" height="112" rx="16" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="560" y="196" width="356" height="112" rx="16" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="940" y="196" width="356" height="112" rx="16" fill="#ffffff" fill-opacity="0.07"/>
  </g>

  <text x="588" y="128" class="num">1,300+</text>
  <text x="588" y="158" class="unit">specs done</text>

  <text x="968" y="128" class="num">1,190+</text>
  <text x="968" y="158" class="unit">decision files: chose, over, why</text>

  <text x="588" y="260" class="num">94%</text>
  <text x="588" y="290" class="unit">of all changed lines came via a spec</text>

  <text x="968" y="260" class="num">800+</text>
  <text x="968" y="290" class="unit">spec commits through the gate</text>
</svg>
