<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 560" role="img" aria-labelledby="t d">
  <title id="t">The commit gate</title>
  <desc id="d">A git commit whose message names a spec id is held by the plugin's hook. The hook runs every verify stage the contexts declare. All green: the commit lands. The first red stage blocks it and its output goes back to the agent. Every spec commit leaves one line in the gate ledger.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="context-stroke"/>
    </marker>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22345a"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1b2a4a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 34px; font-weight: 700; fill: #0f1b2d; }
    .sub { font-size: 18px; fill: #5b6577; }
    .sec { font-size: 14px; font-weight: 700; letter-spacing: 2.5px; fill: #5b6577; }
    .ct { font-size: 22px; font-weight: 700; fill: #0f1b2d; }
    .cb { font-size: 15.5px; fill: #3c4657; }
    .code { font-size: 14.5px; fill: #0f1b2d; }
    .cmd { font-size: 14px; fill: #6b7487; }
    .lbl { font-size: 14px; font-weight: 600; }
  </style>

  <rect width="1360" height="560" rx="24" fill="#f5f6f9"/>

  <text x="64" y="88" class="h1">The commit gate</text>
  <text x="64" y="124" class="sub">A spec commit lands only when every verify: stage your contexts declare is green.</text>

  <text x="64" y="186" class="sec">THE COMMIT</text>
  <text x="510" y="186" class="sec">VERIFY: STAGES</text>
  <text x="976" y="186" class="sec">THE VERDICT</text>

  <g filter="url(#sh)">
    <rect x="64" y="208" width="374" height="196" rx="14" fill="#fff"/>
    <rect x="510" y="208" width="394" height="196" rx="14" fill="#fff"/>
    <rect x="976" y="208" width="320" height="86" rx="14" fill="#fff"/>
    <rect x="976" y="318" width="320" height="86" rx="14" fill="#fff"/>
  </g>
  <rect x="64" y="208" width="6" height="196" rx="3" fill="#c0672b"/>
  <rect x="510" y="208" width="6" height="196" rx="3" fill="#3b5bdb"/>
  <rect x="976" y="208" width="6" height="86" rx="3" fill="#3f8f4f"/>
  <rect x="976" y="318" width="6" height="86" rx="3" fill="#c94141"/>

  <!-- commit -->
  <rect x="94" y="232" width="320" height="66" rx="8" fill="#f1f3f8"/>
  <text x="108" y="259" class="mono code">git commit -m "feat: ticket</text>
  <text x="108" y="282" class="mono code">providers <tspan fill="#a8571f" font-weight="700">(2026-10-27-8a3f)</tspan>"</text>
  <text x="94" y="332" class="cb">The spec id in parentheses is the</text>
  <text x="94" y="355" class="cb">trigger. -F file, -C rev and</text>
  <text x="94" y="378" class="cb">--amend --no-edit are gated too.</text>

  <!-- stages -->
  <g>
    <circle cx="552" cy="250" r="13" fill="#3f8f4f"/>
    <path d="M546 250l4 4l8-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="578" y="256" class="ct" font-size="19">build</text>
    <text x="680" y="256" class="mono cmd">dotnet build</text>

    <circle cx="552" cy="306" r="13" fill="#3f8f4f"/>
    <path d="M546 306l4 4l8-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="578" y="312" class="ct" font-size="19">tests</text>
    <text x="680" y="312" class="mono cmd">dotnet test</text>

    <circle cx="552" cy="362" r="13" fill="#c94141"/>
    <path d="M547 357l10 10M557 357l-10 10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="578" y="368" class="ct" font-size="19">web</text>
    <text x="680" y="368" class="mono cmd">cd web &amp;&amp; npm test</text>
  </g>

  <!-- verdicts -->
  <text x="1008" y="244" class="ct" fill="#2f7a3d">Committed</text>
  <text x="1008" y="272" class="cb">every stage green</text>
  <text x="1008" y="354" class="ct" fill="#b23535">Blocked</text>
  <text x="1008" y="382" class="cb">first red stage, output to the agent</text>

  <g fill="none" stroke-width="2.4">
    <path d="M438 306 L 504 306" stroke="#9aa5b8" marker-end="url(#ah)"/>
    <path d="M904 290 C 940 290, 940 251, 970 251" stroke="#3f8f4f" marker-end="url(#ah)"/>
    <path d="M904 330 C 940 330, 940 361, 970 361" stroke="#c94141" marker-end="url(#ah)"/>
  </g>

  <!-- ledger -->
  <text x="64" y="452" class="sec">THE LEDGER · ONE LINE PER SPEC COMMIT</text>
  <rect x="64" y="470" width="1232" height="56" rx="12" fill="url(#navy)"/>
  <text x="92" y="504" class="mono" font-size="15" fill="#c9d3e6">2026-10-27T09:14:02Z   <tspan fill="#ff8f8f" font-weight="700">blocked</tspan>   2026-10-27-8a3f   /work/repo   a1b2c3d   web</text>
  <text x="1270" y="504" font-size="14" fill="#8fa0bf" text-anchor="end">a spec commit with no line never met the gate</text>
</svg>
