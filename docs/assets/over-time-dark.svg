<line x1="470" y1="96" x2="470" y2="446" stroke="#262c36"/>
<text x="500" y="112" class="mono" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="start"><tspan x="500" dy="0">builds up</tspan></text>
<text x="870" y="112" class="mono" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="start"><tspan x="870" dy="0">what it buys you</tspan></text>
<rect x="500" y="128" width="4" height="40" rx="2" fill="#4493f8"/>
<text x="516" y="146" class="mono" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start"><tspan x="516" dy="0">specs/done/</tspan></text>
<text x="516" y="165" font-size="13.5" font-weight="400" fill="#d1d7e0" text-anchor="start"><tspan x="516" dy="0">every change, with its goal and done criteria</tspan></text>
<text x="870" y="155" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start"><tspan x="870" dy="0">&quot;Why is it like this?&quot; Search the index.</tspan></text>
<rect x="500" y="186" width="4" height="40" rx="2" fill="#3fb950"/>
<text x="516" y="204" class="mono" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start"><tspan x="516" dy="0">decisions/</tspan></text>
<text x="516" y="223" font-size="13.5" font-weight="400" fill="#d1d7e0" text-anchor="start"><tspan x="516" dy="0">what was chosen, over what, and why</tspan></text>
<text x="870" y="213" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start"><tspan x="870" dy="0">No wiki to keep alive.</tspan></text>
<rect x="500" y="244" width="4" height="40" rx="2" fill="#ab7df8"/>
<text x="516" y="262" class="mono" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start"><tspan x="516" dy="0">memory/</tspan></text>
<text x="516" y="281" font-size="13.5" font-weight="400" fill="#d1d7e0" text-anchor="start"><tspan x="516" dy="0">what you told the agent once</tspan></text>
<text x="870" y="271" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start"><tspan x="870" dy="0">You don&#x27;t say it twice.</tspan></text>
<rect x="500" y="302" width="4" height="40" rx="2" fill="#4493f8"/>
<text x="516" y="320" class="mono" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start"><tspan x="516" dy="0">context.yaml</tspan></text>
<text x="516" y="339" font-size="13.5" font-weight="400" fill="#d1d7e0" text-anchor="start"><tspan x="516" dy="0">what&#x27;s done, what&#x27;s active, what&#x27;s next</tspan></text>
<text x="870" y="329" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start"><tspan x="870" dy="0">Restart anything and pick up where you stopped.</tspan></text>
<rect x="500" y="360" width="4" height="40" rx="2" fill="#3fb950"/>
<text x="516" y="378" class="mono" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start"><tspan x="516" dy="0">gate ledger</tspan></text>
<text x="516" y="397" font-size="13.5" font-weight="400" fill="#d1d7e0" text-anchor="start"><tspan x="516" dy="0">one line per gated spec commit</tspan></text>
<text x="870" y="387" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start"><tspan x="870" dy="0">A spec commit without a line never met the gate.</tspan></text>
<text x="500" y="448" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="500" dy="0">Agent Smith after eight months: 1,332 specs done, 6,806 decisions logged.</tspan></text>
</svg>
