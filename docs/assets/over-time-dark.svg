<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">What builds up when you always work this way</title>
  <desc id="d">Each spec adds a done spec, a decision file and sometimes a memory. After months the repository holds why every change was made, what was chosen over what, what you told the agent once, where the work stands and proof that nothing landed red. Agent Smith after eight months: 1,332 specs and 6,806 logged decisions.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="470" rx="12" fill="#151b23"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="12" fill="none" stroke="#3d444d"/>
<text x="28" y="44" font-size="20" font-weight="600" fill="#f0f6fc" text-anchor="start"><tspan x="28" dy="0">What builds up over time</tspan></text>
<text x="28" y="68" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="28" dy="0">Every spec leaves files behind. Nobody writes documentation afterwards; it is already there.</tspan></text>
