# yaml-language-server: $schema=../../decision.schema.json
phase: p01
category: Architecture
chose: "Command Pattern (MediatR-style) as central pattern"
over: "Direct controller-to-service calls or service locator"
reason: |
  Strict separation of "What" (the context object describing the work)
  from "How" (the handler executing it). Each command has exactly one
  handler, dispatched via DI through a single generic interface
  `ICommandHandler<TContext>`. New commands plug in without touching
  any existing dispatch code.

  Alternative — a service-per-feature pattern — was rejected because
  the orchestration loop needs to enqueue and execute commands
  uniformly, and service-per-feature reintroduces a switch statement
  in the executor for every new command type.
alternatives:
  - "Multiple handler interfaces (one per command kind) — rejected, breaks DI-based dispatch"
  - "Reflection-driven dispatch — rejected, opaque to readers and slower than the generic interface"
