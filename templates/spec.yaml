# yaml-language-server: $schema=spec.schema.json
spec: p00
goal: "One line — what we're building and why"

applies_to: "all stacks"   # optional free-text scope hint (e.g. 'server', 'client + docs')

requires: ["p00"]  # spec IDs or free-text preconditions (optional)

decisions:
  - key: "what — why (only non-obvious choices)"

steps:
  - id: step-name
    action: "imperative, single line"
    new:
      - "TypeName: description or { Field:type, ... }"
    modify:
      - "TypeName: what changes"
    path: "project or folder hint"

upgrade_impact: "nothing"   # what an operator must change on update; anything else is opt-in or says why

proven_live: "what only a live check shows, and whether it was done"

tests:
  - "Method_Scenario_Expected"

done:
  - "verifiable completion criterion"
